# CDE Profile Template — nmtc-application-builder
#
# BLANK TEMPLATE. Every value below is empty; fill in your own CDE's details.
#
# The eight keys before "OPTIONAL" are REQUIRED by CDEProfile.from_yaml. Their
# names are the ones the loader reads — do not rename them. Through 1.1.5 this
# scaffold offered `mission_statement`, `service_area_states`,
# `organization_type` and `headquarters_state`, none of which the loader has
# ever read, and omitted `certification_date`, `contact` and `governance`
# entirely. A CDE that filled in every field this file offered still got
# "CDE YAML missing required fields" and had no way to guess the real names.
#
# Verified by tests/test_cde_scaffold_roundtrip.py, which fills this file and
# asserts from_yaml accepts it.

# ── REQUIRED ────────────────────────────────────────────────────────────────

name: ""                  # Full legal CDE name
cde_id: ""                # CDFI Fund CDE certification ID, e.g. "CDE-2025-001"
certification_date: ""    # Date your CDE was certified, as YYYY-MM-DD
mission: ""               # Mission statement, one or two sentences

target_markets: []        # States or markets you deploy into
                          #   e.g. ["Illinois", "Ohio", "Michigan"]

prior_awards: []          # Prior NMTC allocations. Leave as [] if none.
                          # Each entry:
                          #   - year: 2021
                          #     amount: 45000000
                          #     deployment_status: "fully_deployed"   # | in_deployment | not_started
                          #     states: ["IL", "OH"]
                          #     sectors: ["healthcare"]

contact: {}               # e.g.
                          #   name: "Jane Smith"
                          #   title: "President & CEO"
                          #   email: "jsmith@yourcde.org"
                          #   phone: "555-555-5555"

governance: {}            # e.g.
                          #   board_members: 7
                          #   community_representatives: 3
                          #   independent_directors: 4
                          #   board_meeting_frequency: "Quarterly"

# ── OPTIONAL ────────────────────────────────────────────────────────────────

website: ""               # Public website, if you have one
ein: ""                   # Employer Identification Number (XX-XXXXXXX)
headquarters_state: ""    # Two-letter state code
organization_type: ""     # "nonprofit" | "for_profit" | "government"

# ── OPTIONAL — Win Alignment scoring inputs ─────────────────────────────────
#
# Read into CDEProfile.extra and passed to WinProbabilityModel as
# cde_attributes. Omit any you do not have: an omitted field is scored as
# absent, which is correct. Do NOT copy these from the sample file — every
# one of them is a factual claim about your CDE.
#
# See nmtcapp/templates/cde_profile_sample.yaml for a filled-in FICTIONAL
# example of this block.

# years_in_operation: 0
# prior_award_count: 0
# products_below_market_pct: 0.0          # 0–1
# products_flexible_indicia_count: 0
# pipeline_pct_identified: 0.0            # 0–1
# has_own_capital_at_risk: false
# track_record_pipeline_alignment_pct: 0.0
# track_record_deployment_pct: 0.0
# has_quantified_outcomes: false
# has_third_party_validation: false
# lic_board_representation_pct: 0.0
# has_community_engagement_track_record: false
# dbc_focus_years: 0
# dbc_dollar_volume_pct: 0.0
# unrelated_entities_pct: 0.0
# has_favorable_fee_structure: false
# has_prior_reporting_issues: false       # Y/N. This drives a COMPLIANCE
#                                         # STATEMENT in Sections C and E of
#                                         # the generated application. Set it
#                                         # only from your own record.
