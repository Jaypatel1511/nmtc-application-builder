# CDE Profile Template — nmtc-application-builder
#
# BLANK TEMPLATE. Every value below is empty; fill in your own CDE's details.
#
# The eight keys before "OPTIONAL" are REQUIRED by CDEProfile.from_yaml. Their
# names are the ones the loader reads — do not rename them. Through 1.1.5 this
# scaffold offered `mission_statement`, `service_area_states`,
# `organization_type` and `headquarters_state`, none of which the loader has
# ever read, and omitted `certification_date`, `contact` and `governance`
# entirely. A CDE that filled in every field this file offered still got
# "CDE YAML missing required fields" and had no way to guess the real names.
#
# Verified by tests/test_cde_scaffold_roundtrip.py, which fills this file and
# asserts from_yaml accepts it.

# ── REQUIRED ────────────────────────────────────────────────────────────────

name: ""                  # Full legal CDE name
cde_id: ""                # CDFI Fund CDE certification ID, e.g. "CDE-2025-001"
certification_date: ""    # Date your CDE was certified, as YYYY-MM-DD
mission: ""               # Mission statement, one or two sentences

target_markets: []        # States or markets you deploy into
                          #   e.g. ["Illinois", "Ohio", "Michigan"]

prior_awards: []          # Prior NMTC allocations. Leave as [] if none.
                          # Each entry:
                          #   - year: 2021
                          #     amount: 45000000
                          #     deployment_status: "fully_deployed"   # | in_deployment | not_started
                          #     states: ["IL", "OH"]
                          #     sectors: ["healthcare"]

contact: {}               # e.g.
                          #   name: "Jane Smith"
                          #   title: "President & CEO"
                          #   email: "jsmith@yourcde.org"
                          #   phone: "555-555-5555"

governance: {}            # e.g.
                          #   board_members: 7
                          #   community_representatives: 3
                          #   independent_directors: 4
                          #   board_meeting_frequency: "Quarterly"

# ── OPTIONAL ────────────────────────────────────────────────────────────────

website: ""               # Public website, if you have one
ein: ""                   # Employer Identification Number (XX-XXXXXXX)
headquarters_state: ""    # Two-letter state code
organization_type: ""     # "nonprofit" | "for_profit" | "government"

# ── OPTIONAL — Win Alignment scoring inputs ─────────────────────────────────
#
# Read into CDEProfile.extra and passed to WinProbabilityModel as
# cde_attributes.
#
# LEAVE A LINE BLANK IF YOU DO NOT HAVE THE FIGURE. A blank is dropped by
# CDEProfile.from_yaml and never reaches extra, so it is scored as NOT SUPPLIED
# — which is a different thing from zero, and the recommendation engine now
# says which one it is looking at instead of instructing you on a default.
#
#   `false`, `0` and `0.0` ARE ANSWERS and are kept. Type one only if it is
#   true of your CDE.
#
# THESE LINES ARE NO LONGER COMMENTED OUT, AND THAT IS THE POINT (1.5.4 T3).
# Through 1.5.3 this whole block was commented, so the advertised
# `nmtcapp init` -> fill in -> run path produced extra == {} and every input
# below fell to a default. Three of those defaults are not zero:
# pipeline_pct_identified defaults to 0.65 and has_quantified_outcomes to True,
# both invented positions, one moderate and one favourable. Uncommenting them
# WITH their old 0.0/false placeholders would have been worse still — an
# untouched scaffold would have scored below no scaffold at all — so they are
# offered blank instead.
#
# The list is derived from nmtcapp/intelligence/cde_inputs.CDE_SCORING_INPUTS,
# which tests/test_cde_scoring_inputs.py re-derives from win_probability.py's
# own source. A field the model reads and this file does not offer fails there.
#
# Do NOT copy these from the sample file — every one of them is a factual
# claim about your CDE. See nmtcapp/templates/cde_profile_sample.yaml for a
# filled-in FICTIONAL example.


# -- Product Flexibility --
products_below_market_pct:
  # QEI-weighted share of products priced below market, 0-1
  # absent -> the pipeline's measured below-market share, else 0.0
products_flexible_indicia_count:
  # count of documented flexible-terms indicia
  # absent -> 0

# -- Pipeline Credibility --
pipeline_pct_identified:
  # share of pipeline projects identified with LOIs or commitment letters,
  # 0-1
  # absent -> 0.65 — an invented moderate position, not a measurement

# -- Track Record Strength --
prior_award_count:
  # number of prior NMTC allocations. Application.recommendations() and
  # .score_win_probability() inject len(prior_awards) when it is omitted, so
  # on those paths it is always supplied; a direct
  # WinProbabilityModel.score() call gets no such help
  # absent -> 0
years_in_operation:
  # years of direct-financing operation
  # absent -> 0
has_own_capital_at_risk:
  # has the CDE or its parent co-invested balance-sheet capital
  # absent -> False

# -- Track Record Alignment --
track_record_pipeline_alignment_pct:
  # share of the NMTC pipeline supported by similar prior activity, 0-1
  # absent -> 0.0
track_record_deployment_pct:
  # share of prior allocation deployed, 0-1
  # absent -> 0.0

# -- Special Targeting --
pct_persistent_poverty:
  # QEI share in Persistent Poverty Counties, 0-1
  # absent -> the pipeline's measured persistent-poverty share
pct_us_territories:
  # QEI share in U.S. Island Areas / territories, 0-1
  # absent -> the pipeline's measured U.S. territories share

# -- Community Outcomes Quality --
has_quantified_outcomes:
  # are outcome projections quantified (jobs, units, sq ft)
  # absent -> True — a FAVOURABLE assumption, not a measurement
has_third_party_validation:
  # is there a documented third-party impact methodology
  # absent -> False

# -- Community Accountability --
lic_board_representation_pct:
  # share of board seats held by LIC residents or community representatives,
  # 0-1
  # absent -> 0.0
has_community_engagement_track_record:
  # is there a documented community engagement history
  # absent -> False

# -- DBC Track Record --
dbc_focus_years:
  # years of Disadvantaged Business/Community focus
  # absent -> 0
dbc_dollar_volume_pct:
  # share of direct financing volume to DBCs, 0-1
  # absent -> 0.0

# -- Unrelated Entities --
unrelated_entities_pct:
  # QEI share to entities unrelated to the CDE, 0-1
  # absent -> the pipeline's measured unrelated-entity share, else 0.0

# ── NOT SCORED, but read ────────────────────────────────────────────────────
#
# These reach the tool through the same block and move NO score. They are
# reported as declarations (Phase 2 flags and the Question 22(c) commitment) or
# drive a compliance statement. Kept separate so a reader is not led to think
# filling them in raises anything.
non_metro_commitment_pct:
  # the CDE's OWN declared Question 22(c) minimum Non-Metropolitan QLICI
  # commitment, 0-1. Reported unchanged; never computed from the pipeline
  # absent -> None — reported as not declared
has_favorable_fee_structure:
  # informational Phase 2 flag
  # absent -> None
has_prior_reporting_issues:
  # Y/N. Drives a COMPLIANCE STATEMENT in Sections C and E of the generated
  # application. Set it only from your own record
  # absent -> False
