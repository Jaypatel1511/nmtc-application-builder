[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmtc-application-builder"
version = "1.3.0"
description = "Flagship NMTC application intelligence platform — pipeline analysis, eligibility validation, readiness scoring, and visualization for CDEs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jay Patel", email = "thejaypatel1511@gmail.com" }]
keywords = ["nmtc", "cdfi", "community-development", "new-markets-tax-credit", "pipeline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "pyyaml>=6.0",
    # 0.3.4 was the IMPORT floor (first version exporting NMTCMapperError,
    # EligibilityDownloadError and data_source, used in nmtc_mapper_adapter).
    # 0.4.2 is the CORRECTNESS floor: 0.3.1–0.4.1 report 168 census tracts as
    # not NMTC-eligible when they statutorily are. 0.4.2's loader moves
    # 35,167 → 35,335 eligible of the same 85,395 tracts — a delta of exactly
    # 168, verified against the installed 0.4.2 docstring.
    "nmtc-mapper>=0.4.2",
    "nmtc-calc>=0.1.0",
    "cdfidata>=0.1.7",
    "impact-ledger>=0.2.0",
    # hmda-analyzer and cra-scraper were REMOVED in 1.2.0.
    #   hmda-analyzer  its only consumer, integrations/hmda_adapter.py, could
    #                  not reach real HMDA data by any code path and published
    #                  hardcoded disparity literals as application prose. The
    #                  adapter is gone, so the dependency goes with it rather
    #                  than having its floor raised.
    #   cra-scraper    zero imports repo-wide, in any release. It was declared
    #                  and never used.
]

[project.scripts]
nmtcapp = "nmtcapp.cli:main"

[project.optional-dependencies]
word = [
    "python-docx>=1.1.0",
]
excel = [
    "openpyxl>=3.0.9",
]
pdf = [
    "reportlab>=4.0.0",
]
viz = [
    "matplotlib>=3.7",
]
output = [
    "python-docx>=1.1.0",
    "openpyxl>=3.0.9",
    "reportlab>=4.0.0",
]
# THE DOCS TOOLCHAIN, PINNED. `pip install -e ".[docs]"` emitted
#   WARNING: nmtc-application-builder 1.2.0 does not provide the extra 'docs'
# and silently installed only the core — so a maintainer who followed the
# contributing guide got a docs build with no mkdocs and, once mkdocs was
# installed by hand, a sample-output hook quietly producing two of four
# formats because python-docx and reportlab were absent. Nothing anywhere
# pinned any of it.
#
# The output libraries are here as well as in [output] on purpose: the docs
# build RENDERS the sample application, so they are docs build-dependencies,
# not an optional extra a docs author can skip.
#
# Floors are set by what the build actually uses:
#   mkdocs           1.5 is the first release with the `hooks:` config key
#                    that mkdocs.yml uses to load
#                    docs/hooks/generate_sample_output.py.
#   mkdocs-material  9.0 is the first release supporting mkdocs 1.5's schema
#                    and the navigation.tabs/sections features mkdocs.yml sets.
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.0.9",
    "reportlab>=4.0.0",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyter>=1.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.0.9",
    "reportlab>=4.0.0",
    "matplotlib>=3.7",
    "pypdf>=4.0",
    # Required by tests/test_streamlit_chart_smoke.py (plotly, via
    # streamlit_app/chart_style.py) and tests/test_streamlit_upload_profile.py
    # (streamlit, via streamlit_app/utils.py). Nothing under nmtcapp/ imports
    # either, so these are test tooling, not runtime dependencies.
    #
    # Floors are set by the newest API the code actually calls, verified against
    # the released distributions rather than copied from a lockfile:
    #   streamlit  st.navigation and st.Page (streamlit_app/app.py:165-172) are
    #              both exported first in 1.36.0; 1.35.0 has neither.
    #   plotly     fig.add_vline (pages/3_Pipeline_Optimizer.py:237) first
    #              appears in 4.12.0; 4.11.0 has no such method.
    "streamlit>=1.36.0",
    "plotly>=4.12.0",
]

[project.urls]
Homepage = "https://github.com/Jaypatel1511/nmtc-application-builder"
Repository = "https://github.com/Jaypatel1511/nmtc-application-builder"
Documentation = "https://github.com/Jaypatel1511/nmtc-application-builder#readme"
"Issue Tracker" = "https://github.com/Jaypatel1511/nmtc-application-builder/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "wheel: slow end-to-end wheel build + install test (deselect with '-m not wheel')",
]
# A parametrized test whose argument list comes out EMPTY is silently marked
# skipped by default, and a skip exits 0. That is the same vacuity class the
# release gates exist to close: the test reports success while asserting
# nothing. fail_at_collect turns "Empty parameter set in 'test_x'" into a
# collection ERROR, so a generator that stops finding inputs fails loudly
# instead of quietly certifying nothing.
#
# This repo has a live instance, which is why it is not a theoretical setting:
# tests/test_streamlit_page_py39.py::test_pep604_annotations_require_future_import
# parametrizes over _streamlit_modules(). Where streamlit_app/ is absent -- a
# wheel-only install, since the wheel does not carry it -- that list is empty
# and the test SKIPPED rather than passing, so the py39 guard silently stopped
# guarding. Under fail_at_collect that same install errors at collection.
empty_parameter_set_mark = "fail_at_collect"

[tool.setuptools.packages.find]
where = ["."]
include = ["nmtcapp*"]

# Templates ship INSIDE the package. Without this the wheel carried no
# templates at all — MANIFEST.in governs only the sdist, and `pip install`
# uses the wheel — so `nmtcapp init` failed for every PyPI user with
# "Cannot locate the templates directory". Declared here rather than as a
# top-level data-files entry so nothing generic lands in site-packages.
[tool.setuptools.package-data]
nmtcapp = ["templates/*.yaml", "templates/*.csv", "templates/*.xlsx"]
