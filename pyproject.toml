[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmtc-application-builder"
version = "1.1.5"
description = "Flagship NMTC application intelligence platform — pipeline analysis, eligibility validation, readiness scoring, and visualization for CDEs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jay Patel", email = "thejaypatel1511@gmail.com" }]
keywords = ["nmtc", "cdfi", "community-development", "new-markets-tax-credit", "pipeline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "pyyaml>=6.0",
    "nmtc-mapper>=0.3.4",
    "nmtc-calc>=0.1.0",
    "hmda-analyzer>=0.1.0",
    "cdfidata>=0.1.7",
    "impact-ledger>=0.2.0",
    "cra-scraper>=0.1.0",
]

[project.scripts]
nmtcapp = "nmtcapp.cli:main"

[project.optional-dependencies]
word = [
    "python-docx>=1.1.0",
]
excel = [
    "openpyxl>=3.0.9",
]
pdf = [
    "reportlab>=4.0.0",
]
viz = [
    "matplotlib>=3.7",
]
output = [
    "python-docx>=1.1.0",
    "openpyxl>=3.0.9",
    "reportlab>=4.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyter>=1.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.0.9",
    "reportlab>=4.0.0",
    "matplotlib>=3.7",
    "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/Jaypatel1511/nmtc-application-builder"
Repository = "https://github.com/Jaypatel1511/nmtc-application-builder"
Documentation = "https://github.com/Jaypatel1511/nmtc-application-builder#readme"
"Issue Tracker" = "https://github.com/Jaypatel1511/nmtc-application-builder/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "wheel: slow end-to-end wheel build + install test (deselect with '-m not wheel')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nmtcapp*"]
