[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmtc-application-builder"
version = "1.5.5"
description = "Flagship NMTC application intelligence platform — pipeline analysis, eligibility validation, readiness scoring, and visualization for CDEs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jay Patel", email = "thejaypatel1511@gmail.com" }]
keywords = ["nmtc", "cdfi", "community-development", "new-markets-tax-credit", "pipeline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "pyyaml>=6.0",
    # 0.3.4 was the IMPORT floor (first version exporting NMTCMapperError,
    # EligibilityDownloadError and data_source, used in nmtc_mapper_adapter).
    # 0.4.2 was the CORRECTNESS floor: 0.3.1–0.4.1 report 168 census tracts as
    # not NMTC-eligible when they statutorily are. 0.4.2's loader moves
    # 35,167 → 35,335 eligible of the same 85,395 tracts — a delta of exactly
    # 168, verified against the installed 0.4.2 docstring.
    #
    # 0.5.0 IS THE CONTRACT FLOOR (1.4.0 R1), and this floor is why the release
    # is a minor rather than a patch — but NOT for the reason it is natural to
    # assume. The assumption was measured, and it was false.
    #
    # THE FIELD IS NOT NEW. EligibilityResult.is_non_metro exists in EVERY
    # release back to 0.3.4 — verified by installing each one and introspecting
    # the dataclass: 0.3.4, 0.4.0, 0.4.1, 0.4.2, 0.4.3 and 0.5.0 all carry it.
    # A floor justified as "the field does not exist below 0.5.0" would have
    # been a true-sounding sentence about a false fact, and any gate built on
    # it would have passed against 0.4.3 while the defect shipped.
    #
    # WHAT CHANGES AT 0.5.0 IS THE TYPE, and it is what the whole round turns
    # on:
    #
    #     0.4.2 / 0.4.3   is_non_metro: bool            indeterminate -> False
    #     0.5.0           is_non_metro: Optional[bool]  indeterminate -> None
    #
    # Under 0.4.3 a tract the mapper could not resolve reports as NOT
    # non-metropolitan, and intelligence/geographic_analysis reads that as a
    # determination and puts the dollars in the METROPOLITAN bucket. That is
    # exactly the defect 1.4.0 R2 removed from this package, re-entering
    # through the dependency: the third bucket silently empties and every
    # unverified dollar is counted metropolitan again — no error, no exception,
    # and not one changed line in this repository.
    #
    # THE GATE IS tests/integrations/test_mapper_contract.py, which introspects
    # the INSTALLED library rather than a mock. Verified both ways:
    # test_the_floor_field_is_tri_state_not_a_bool is RED against 0.4.3 and
    # GREEN against 0.5.0.
    #
    # THIS PACKAGE HAS ALREADY BEEN BROKEN ONCE BY AN OPEN FLOOR, in the other
    # direction. 0.5.0 REMOVED is_nmtc_native_area while ">=0.4.2" still
    # resolved to it, and `nmtcapp analyze` raised on the first real project
    # while the whole suite stayed green — the test doubles constructed the
    # field themselves. That is why the floor and the contract test ship
    # together: the floor makes the gate's answer binding rather than advisory.
    "nmtc-mapper>=0.5.0",
    "nmtc-calc>=0.1.0",
    "cdfidata>=0.1.7",
    "impact-ledger>=0.2.0",
    # hmda-analyzer and cra-scraper were REMOVED in 1.2.0.
    #   hmda-analyzer  its only consumer, integrations/hmda_adapter.py, could
    #                  not reach real HMDA data by any code path and published
    #                  hardcoded disparity literals as application prose. The
    #                  adapter is gone, so the dependency goes with it rather
    #                  than having its floor raised.
    #   cra-scraper    zero imports repo-wide, in any release. It was declared
    #                  and never used.
]

[project.scripts]
nmtcapp = "nmtcapp.cli:main"

# UPPER BOUNDS ON THE FIVE LIBRARIES THAT DECIDE FILED BYTES (1.5.5 B7b).
#
# reportlab, python-docx, openpyxl and matplotlib RENDER what a CDE files (or,
# for openpyxl and matplotlib, are also what a gate reads the result back
# with). pypdf MEASURES the filed PDF. All five are bounded, and
# tests/test_output_dependency_bounds.py fails if any of them stops being.
#
# WHY AT ALL: an unbounded requirement means a release published by a third
# party changes what this package prints -- or what its gates read off what it
# prints -- with no commit here and no review by anyone. That already
# happened, to pypdf, on 2026-08-23.
#
# WHY THE BOUNDS ARE NOT ALL THE SAME SHAPE. This is the part that is easy to
# get wrong, so it is stated plainly: A MAJOR-VERSION CAP WOULD NOT HAVE
# PREVENTED B7. pypdf broke the suite going 6.16.1 -> 6.16.2, a PATCH release;
# "<7" would have resolved it and main would be red regardless. The asymmetry
# is deliberate and rests on WHICH GATE SURVIVES THE DRIFT:
#
#   A RENDERER drifting is CAUGHT. reportlab laying a glyph out differently
#   changes the document, tests/test_rendered_output_baseline.py goes red, and
#   a human is handed a diff OF THE DOCUMENT in the pull request. That is the
#   system working. A major cap is the right size there: it refuses the
#   announced-breaking boundary and takes patch and minor fixes, security ones
#   included, without a release here.
#
#   THE MEASURER drifting is NOT caught -- it corrupts the detector. pypdf
#   reported four changed lines in a PDF that was byte-identical. No gate can
#   see that, because the gate is the thing that moved. So pypdf is bounded at
#   the exact bisected release and nothing looser.
#
# Bounds are set at the next major above what resolves today (reportlab 5.0.1,
# python-docx 1.2.0, openpyxl 3.1.5, matplotlib 3.11.1), so NOTHING IS
# DOWNGRADED by this change and no environment that worked stops working.
#
# THE KNOWN COST, STATED RATHER THAN DISCOVERED LATER: these caps reach USERS
# through [pdf], [word], [excel], [viz], [output] and [docs], so a CDE cannot
# adopt the next major of a renderer without a release here. That is accepted
# on the same ground as streamlit_app/requirements.txt's equality pin -- this
# is an end-user tool whose output goes into a federal filing, not a library
# other packages depend on, so the resolver-conflict cost that normally argues
# against capping is small and the silent-drift cost is not.
#
# NOT BOUNDED HERE, AND NOT AN OVERSIGHT: streamlit (>=1.28.0) and mkdocs
# (>=1.5) are both open against known-breaking majors and are both RECORDED as
# real. They need their own decision about what upper bound is safe -- the
# streamlit floor is separately already wrong, sitting below
# st.pyplot(..., width="stretch") -- and that decision is not this round's.
[project.optional-dependencies]
word = [
    "python-docx>=1.1.0,<2",
]
excel = [
    "openpyxl>=3.0.9,<4",
]
pdf = [
    "reportlab>=4.0.0,<6",
]
viz = [
    "matplotlib>=3.7,<4",
]
output = [
    "python-docx>=1.1.0,<2",
    "openpyxl>=3.0.9,<4",
    "reportlab>=4.0.0,<6",
]
# THE DOCS TOOLCHAIN, PINNED. `pip install -e ".[docs]"` emitted
#   WARNING: nmtc-application-builder 1.2.0 does not provide the extra 'docs'
# and silently installed only the core — so a maintainer who followed the
# contributing guide got a docs build with no mkdocs and, once mkdocs was
# installed by hand, a sample-output hook quietly producing two of four
# formats because python-docx and reportlab were absent. Nothing anywhere
# pinned any of it.
#
# The output libraries are here as well as in [output] on purpose: the docs
# build RENDERS the sample application, so they are docs build-dependencies,
# not an optional extra a docs author can skip.
#
# Floors are set by what the build actually uses:
#   mkdocs           1.5 is the first release with the `hooks:` config key
#                    that mkdocs.yml uses to load
#                    docs/hooks/generate_sample_output.py.
#   mkdocs-material  9.0 is the first release supporting mkdocs 1.5's schema
#                    and the navigation.tabs/sections features mkdocs.yml sets.
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "python-docx>=1.1.0,<2",
    "openpyxl>=3.0.9,<4",
    "reportlab>=4.0.0,<6",
    "matplotlib>=3.7,<4",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyter>=1.0",
    "python-docx>=1.1.0,<2",
    "openpyxl>=3.0.9,<4",
    "reportlab>=4.0.0,<6",
    "matplotlib>=3.7,<4",
    # PYPDF IS BOUNDED AT A PATCH RELEASE, NOT AT A MAJOR, AND THE NUMBER WAS
    # BISECTED RATHER THAN GUESSED (1.5.5 B7).
    #
    # WHAT HAPPENED. main went red on all four interpreters with NOT ONE
    # COMMIT between the green run and the red one -- the same tree had passed
    # on the pull request eleven hours earlier. One failure everywhere:
    # test_rendered_output_baseline[pdf], and the entire diff was TWO LEADING
    # SPACES ("Metric" -> " Metric"). No number, word or sentence moved.
    #
    # pypdf published 6.16.2 on 2026-08-23, inside that window, and this line
    # read ">=4.0" -- so CI resolved a release that did not exist when the
    # pull request passed.
    #
    # THE BOUND IS <6.16.2 AND NOT <6. The planning ruling said "<6"; the
    # bisect refutes it. 6.0.0 through 6.16.1 are GREEN against the committed
    # baseline; only 6.16.2 is RED. Measured on 3.12 by installing each and
    # running the one test, binary-searching the 42 published 6.x releases,
    # then alternating the boundary twice to rule out a dirty environment:
    #
    #     pypdf 5.9.0   1 passed        pypdf 6.16.0   1 passed
    #     pypdf 6.0.0   1 passed        pypdf 6.16.1   1 passed
    #     pypdf 6.8.0   1 passed        pypdf 6.16.2   1 FAILED
    #     pypdf 6.14.0  1 passed        pypdf 6.16.1   1 passed
    #     pypdf 6.15.0  1 passed        pypdf 6.16.2   1 FAILED
    #
    # "<6" would have excluded sixteen minor series that are provably green,
    # including the 6.15.0/6.16.0/6.16.1 SECURITY releases -- a cost paid for
    # nothing.
    #
    # WHAT MOVED, read out of the sdists rather than inferred: 6.16.2's
    # _text_extraction/__init__.py takes the space/newline scale factors from
    # the combined text x CTM matrix instead of the text matrix alone, so a
    # gap that used to fall short of the space threshold now clears it.
    # pypdf files it under Bug Fixes, and it is plausibly the MORE faithful
    # reading of the page.
    #
    # THE BASELINE IS DELIBERATELY NOT REGENERATED. Adopting a new reading of
    # the tool that MEASURES filed documents is not a patch-scoped decision,
    # and taking it under the pressure of a red main -- at the tag of a
    # release whose whole thesis is that rendered output is verified -- is
    # exactly backwards. It gets its own round, with a human reading the
    # document. Recorded as out of scope for 1.5.5.
    #
    # REPORTLAB WAS TESTED FIRST AND REFUTED. The failure reproduces on
    # reportlab 4.5.1 AND on 5.0.1, and disappears on either the moment pypdf
    # steps back one patch.
    #
    # pypdf IS TEST-ONLY. It is declared here in [dev] and NOWHERE ELSE -- not
    # [pdf], not [output], not [docs], not streamlit_app/requirements.txt. No
    # CDE installs it, and the PDF a CDE files did not change by one byte.
    # What drifted was this repository's MEASUREMENT of it.
    #
    # tests/test_output_dependency_bounds.py is the gate. It asserts that a
    # bound EXISTS; the value is this comment's job.
    "pypdf>=4.0,<6.16.2",
    # Required by tests/test_streamlit_chart_smoke.py (plotly, via
    # streamlit_app/chart_style.py) and tests/test_streamlit_upload_profile.py
    # (streamlit, via streamlit_app/utils.py). Nothing under nmtcapp/ imports
    # either, so these are test tooling, not runtime dependencies.
    #
    # Floors are set by the newest API the code actually calls, verified against
    # the released distributions rather than copied from a lockfile:
    #   streamlit  st.navigation and st.Page (streamlit_app/app.py:165-172) are
    #              both exported first in 1.36.0; 1.35.0 has neither.
    #   plotly     fig.add_vline (pages/3_Pipeline_Optimizer.py:237) first
    #              appears in 4.12.0; 4.11.0 has no such method.
    "streamlit>=1.36.0",
    "plotly>=4.12.0",
    # Required by tests/test_small_claims.py::
    # test_the_sample_output_page_is_rendered_not_escaped, which calls
    # docs/hooks/generate_sample_output.py::_html() directly. That hook
    # imports markdown, and the hook is RIGHT to assume it: mkdocs 1.6.1
    # declares markdown>=3.3.6 unconditionally, so at docs-build time the
    # import always succeeds. Verified first-hand against the installed
    # distribution rather than assumed -- the ==3.3.6 pin in mkdocs metadata
    # sits behind its own min-versions extra and is a different requirement.
    #
    # THE DEFECT WAS THAT THE GATE RAN FROM THE test JOB, WHICH INSTALLS
    # THIS EXTRA AND NOT [docs]. CI went red on all four interpreters with
    # ModuleNotFoundError while docs -- the only job with markdown -- stayed
    # green. It passed in the build session's venv for a reason unrelated to
    # the code: .venv-work had markdown 3.10.3 pulled in by an earlier
    # pip install -e '.[docs]'.
    #
    # DO NOT CLOSE THIS WITH importorskip, skipif OR try/except. Any of the
    # three turns CI green by permanently disarming the gate that keeps the
    # FICTIONAL-DATA WARNING rendered as a warning -- the sentence telling a
    # reader that Riverbend Community Capital CDE does not exist and the four
    # downloadable federal application documents must not be filed. _html()
    # once html.escaped that body into a <pre> and published the warning as a
    # raw admonition marker. A conditionally-skipped safety gate is silently
    # untested forever, which is this project's most-recorded failure shape.
    #
    # FLOOR: 3.3.6, the same lower bound mkdocs resolves under, so the test
    # job and the docs job exercise the same one. Measured, not copied: the
    # five assertions in that test all pass against markdown 3.3.6 on 3.9 and
    # against 3.10.3 on 3.12, both ends of the supported range.
    "markdown>=3.3.6",
]

[project.urls]
Homepage = "https://github.com/Jaypatel1511/nmtc-application-builder"
Repository = "https://github.com/Jaypatel1511/nmtc-application-builder"
Documentation = "https://github.com/Jaypatel1511/nmtc-application-builder#readme"
"Issue Tracker" = "https://github.com/Jaypatel1511/nmtc-application-builder/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "wheel: slow end-to-end wheel build + install test (deselect with '-m not wheel')",
    # OPT-IN, AND DELIBERATELY NOT PART OF ANY GATE. Reaches cdfifund.gov to
    # answer the one question no offline test can (has the CY 2026 round
    # opened?). CI must not depend on a federal website being up: a suite that
    # goes red for reasons outside this repository is one people learn to
    # ignore. Run it when tests/test_round_provenance.py's expiry fires:
    #     pytest -m network tests/test_round_provenance.py
    "network: reaches the public internet; skipped unless -m network is given",
]
# A parametrized test whose argument list comes out EMPTY is silently marked
# skipped by default, and a skip exits 0. That is the same vacuity class the
# release gates exist to close: the test reports success while asserting
# nothing. fail_at_collect turns "Empty parameter set in 'test_x'" into a
# collection ERROR, so a generator that stops finding inputs fails loudly
# instead of quietly certifying nothing.
#
# This repo has a live instance, which is why it is not a theoretical setting:
# tests/test_streamlit_page_py39.py::test_pep604_annotations_require_future_import
# parametrizes over _streamlit_modules(). Where streamlit_app/ is absent -- a
# wheel-only install, since the wheel does not carry it -- that list is empty
# and the test SKIPPED rather than passing, so the py39 guard silently stopped
# guarding. Under fail_at_collect that same install errors at collection.
empty_parameter_set_mark = "fail_at_collect"

[tool.setuptools.packages.find]
where = ["."]
include = ["nmtcapp*"]

# Templates ship INSIDE the package. Without this the wheel carried no
# templates at all — MANIFEST.in governs only the sdist, and `pip install`
# uses the wheel — so `nmtcapp init` failed for every PyPI user with
# "Cannot locate the templates directory". Declared here rather than as a
# top-level data-files entry so nothing generic lands in site-packages.
[tool.setuptools.package-data]
nmtcapp = ["templates/*.yaml", "templates/*.csv", "templates/*.xlsx"]
