# ---------------------------------------------------------------------------
# CDFI Fund CY 2024-2025 Scoring Inputs
# These are used by WinProbabilityModel.score() when loaded via CDEProfile.from_yaml().
#
# Calibrated so Riverbend scores approximately:
#   Business Strategy:   43 / 50
#   Community Outcomes:  47 / 50  (pipeline-dependent)
#   Priority Points:      9 / 10
#   Aggregate base:      ~90 / 100  →  Tier: Highly Qualified
# ---------------------------------------------------------------------------

# --- Business Strategy ---
products_below_market_pct: 0.42         # 42% of products offered below market rate (< 50% threshold)
products_flexible_indicia_count: 5      # exactly 5 indicia of flexible terms (meets CDFI Fund threshold)
pipeline_pct_identified: 0.83           # 83% of pipeline projects have signed LOIs
has_own_capital_at_risk: false          # CDE has not committed own balance-sheet capital
prior_award_count: 3                    # 3 prior NMTC allocations
years_in_operation: 7                   # 7 years as a certified CDE
track_record_pipeline_alignment_pct: 0.76   # 76% of NMTC pipeline supported by similar prior activity (≥ 70% threshold)
track_record_deployment_pct: 0.80           # 80% of prior allocation deployed on schedule (< 90% threshold)

# --- Community Outcomes ---
pct_persistent_poverty: 0.31            # 31% of QEI committed to Persistent Poverty Counties
pct_us_territories: 0.00                # No QEI in US Territories
has_quantified_outcomes: true           # CDE provides quantified impact projections (jobs, units, sq ft)
has_third_party_validation: true        # Third-party methodology supports outcome projections
lic_board_representation_pct: 0.44     # 44% of board are LIC residents / community representatives
has_community_engagement_track_record: true  # Documented community engagement track record

# --- Priority Points ---
dbc_focus_years: 4                      # 4 years serving Disadvantaged Businesses/Communities (< 5 threshold)
dbc_dollar_volume_pct: 0.62             # 62% of direct financing volume to DBCs (< 70% threshold)
unrelated_entities_pct: 0.82            # 82% of QEIs to unrelated entities (< 90% threshold)

# --- Phase 2 Flags (informational, not scored) ---
has_favorable_fee_structure: true       # CDE fee and compensation structure is favorable to QALICBs
has_prior_reporting_issues: false       # No prior reporting compliance issues (clean record)
non_metro_commitment_pct: 0.22          # 22% non-metro commitment (meets 20% minimum)
