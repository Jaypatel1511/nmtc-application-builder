name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default. Without this block GITHUB_TOKEN in every job
# inherits the repository-default scopes, which on a permissive default is
# read/write across contents, issues, packages and more -- handed to
# verify-version, build and test-wheel, none of which write anything.
# The publish job below overrides this with the single elevated scope it
# genuinely needs (id-token: write, for OIDC trusted publishing); that override
# is job-scoped, so it does not widen anything else.
permissions:
  contents: read

jobs:
  verify-version:
    name: Guard — tag must match pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Check tag equals pyproject.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Git tag    : $TAG"
          echo "Tag version: $TAG_VERSION"
          echo "pyproject  : $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "ERROR: git tag '$TAG' does not match pyproject.toml version '$PYPROJECT_VERSION'."
            exit 1
          fi
          echo "Version guard passed: $TAG_VERSION == $PYPROJECT_VERSION"

  build:
    name: Build wheel + sdist
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Install build toolchain
        run: pip install build
      - name: Build
        run: python -m build

      # This assertion lives HERE, not in test-sdist, because `build` is the only
      # job holding both the checkout and the tarball. It is an exact set
      # comparison rather than a magic number: a `-lt N` threshold pinned to the
      # count shipping that day fails the job with "check MANIFEST.in" when
      # someone legitimately deletes or merges a test module -- blaming packaging
      # for a deliberate source change. The invariant that actually matters is
      # "the tarball contains every test module the repository has", which needs
      # no threshold. On this repo that distinction is not academic: the suite is
      # mostly nested, and the pre-MANIFEST.in tarball shipped 14 of 50 modules.
      #
      # WHAT THIS STEP DOES NOT CERTIFY -- read this before "simplifying" the
      # pipeline down to this one count, and note that this repo is the ONLY
      # one in the sweep where it fires at all. It compares test_*.py names
      # ONLY, and setuptools' legacy sdist default ALREADY matches
      # tests/test*.py. So on a flat suite it passes against a completely
      # broken MANIFEST.in. Verified across the sweep on pre-fix tarballs:
      # cdfi-benchmark 5/5 PASS, hmda-analyzer 8/8 PASS, cdfi-data 4/4 PASS,
      # nmtc-mapper 14/14 PASS -- all four green with tests/conftest.py absent
      # from the tarball. Only this repo failed, 14 of 50, and only because 36
      # of its modules sit below tests/ where the default pattern reaches
      # nothing. Flatten this suite and this step goes quiet.
      #
      # It cannot see conftest.py go missing in ANY repo, this one included:
      # conftest.py is not a test_*.py. Same for templates/ and streamlit_app/.
      # The check actually doing the work is the required-files loop in
      # test-sdist. Delete that loop and keep this count, and the release gate
      # certifies nothing about the files whose absence broke 1.1.5.
      - name: Assert the sdist ships every test module in the checkout
        shell: bash
        run: |
          set -euo pipefail
          SDIST="$(ls dist/*.tar.gz)"
          # Compare on paths relative to the sdist/checkout root, so nested test
          # packages (tests/<subdir>/test_*.py) are covered too, not just the top
          # level. Tarball entries are "<name>-<version>/tests/..."; stripping the
          # first path component makes the two lists directly comparable.
          find tests -name 'test_*.py' | sed 's|^|/|' | sort > "${RUNNER_TEMP}/repo-tests.txt"
          # grep exits 1 on no-match and 2 on error: tolerate 1 so a tarball with
          # zero test modules reaches the emptiness check below, which is what
          # produces the real message; let 2 kill the step here. Unguarded, a
          # no-match killed this step under `pipefail` with no output at all.
          tar tzf "${SDIST}" | sed 's|^[^/]*||' \
            | { grep -E '^/tests/(.*/)?test_[^/]*\.py$' || test $? -eq 1; } \
            | sort > "${RUNNER_TEMP}/sdist-tests.txt"

          echo "test modules in checkout : $(wc -l < "${RUNNER_TEMP}/repo-tests.txt")"
          echo "test modules in sdist    : $(wc -l < "${RUNNER_TEMP}/sdist-tests.txt")"

          if [ ! -s "${RUNNER_TEMP}/sdist-tests.txt" ]; then
            echo "::error::sdist ships no test modules at all — MANIFEST.in matches nothing"
            exit 1
          fi

          MISSING="$(comm -23 "${RUNNER_TEMP}/repo-tests.txt" "${RUNNER_TEMP}/sdist-tests.txt")"
          if [ -n "${MISSING}" ]; then
            echo "::error::sdist is missing test modules that exist in the checkout:"
            echo "${MISSING}"
            echo "::error::Fix MANIFEST.in (recursive-include tests *.py)."
            exit 1
          fi
          echo "sdist ships every test module in the checkout"

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  test-wheel:
    name: Test wheel — Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Install built wheel into a fresh venv
        run: |
          python -m venv /tmp/wheel_test_venv
          /tmp/wheel_test_venv/bin/pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          /tmp/wheel_test_venv/bin/pip install "${WHEEL}[dev]"
      - name: Confirm installed version matches the tag
        run: |
          INSTALLED=$(/tmp/wheel_test_venv/bin/python -c "import nmtcapp; print(nmtcapp.__version__)")
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Installed: $INSTALLED   Expected: $TAG"
          if [ "$INSTALLED" != "$TAG" ]; then
            echo "ERROR: installed __version__ does not match the git tag."
            exit 1
          fi
      - name: Run suite against installed wheel
        run: |
          /tmp/wheel_test_venv/bin/pytest tests/ -m "not wheel" -v --tb=short --no-header --import-mode=importlib

  # Test the built SDIST, running the suite THAT SHIPPED INSIDE IT.
  #
  # This job exists because test-wheel cannot catch a broken sdist: it runs
  # `pytest tests/` against the git checkout, so the tarball could ship zero
  # tests and every gate would still be green. That is close to what was
  # happening here. setuptools' legacy sdist default matches only
  # tests/test*.py, which on this repo matched 14 of 50 test modules (the suite
  # is mostly nested) and neither conftest.py nor __init__.py. The 14 that did
  # ship could not run: installing the published 1.1.5 sdist and running its own
  # tests/ interrupts at collection and executes ZERO tests, because four
  # modules import from streamlit_app/ and others read templates/, neither of
  # which the tarball carried. Every gate was green, because no gate ever
  # installed the sdist. A gate must consume the artifact it certifies.
  #
  # Nothing in this job comes from the repository.
  test-sdist:
    name: Test sdist — Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      # NOTE: deliberately NO actions/checkout. If the checkout is absent, it
      # cannot leak into the thing under test.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Unpack the sdist, install it, and run its own suite
        shell: bash
        run: |
          set -euo pipefail
          SDIST="$(ls dist/*.tar.gz)"
          echo "sdist under test: ${SDIST}"

          WORK="${RUNNER_TEMP}/sdist-work"
          mkdir -p "${WORK}"
          tar xzf "${SDIST}" -C "${WORK}"
          SRC="$(find "${WORK}" -maxdepth 1 -mindepth 1 -type d)"
          echo "--- files the sdist actually contains ---"
          tar tzf "${SDIST}"

          # Fail with a sentence, not with a collection abort. Each path here is
          # something the SHIPPED SUITE reads, and each was missing before
          # MANIFEST.in existed:
          #   tests/conftest.py            nine fixtures, used by 30 nested modules
          #   tests/__init__.py            makes tests/ a package
          #   nmtcapp/templates/pipeline_template.xlsx  read by test_template_* directly
          #   streamlit_app/chart_style.py  imported by test_streamlit_chart_smoke
          #   streamlit_app/utils.py        imported by test_streamlit_upload_profile
          #
          # The hint names the directive that covers the path that is actually
          # missing. A single "recursive-include tests *.py" hint would send
          # whoever hits a templates/ or streamlit_app/ failure to the wrong line.
          for required in tests/conftest.py tests/__init__.py README.md pyproject.toml \
                          nmtcapp/templates/pipeline_template.xlsx nmtcapp/templates/cde_profile_sample.yaml \
                          streamlit_app/chart_style.py streamlit_app/utils.py; do
            if [ ! -f "${SRC}/${required}" ]; then
              case "${required}" in
                tests/*)         HINT="recursive-include tests *.py" ;;
                nmtcapp/templates/*) HINT="[tool.setuptools.package-data] nmtcapp + recursive-include nmtcapp/templates *.yaml *.csv *.xlsx" ;;
                streamlit_app/*) HINT="recursive-include streamlit_app *.py *.txt *.md" ;;
                *)               HINT="include ${required}" ;;
              esac
              echo "::error::sdist is missing ${required} — check MANIFEST.in (${HINT})"
              exit 1
            fi
          done

          # The nested test packages are the majority of this suite. Assert at
          # least one of them arrived, so a MANIFEST.in that somehow matched only
          # the top level cannot pass as complete.
          if [ ! -f "${SRC}/tests/intelligence/test_pipeline_analyzer.py" ]; then
            echo "::error::sdist carries no nested test packages — 36 of 50 test modules live under tests/<subdir>/"
            exit 1
          fi

          python -m venv "${RUNNER_TEMP}/sdist-venv"
          VPY="${RUNNER_TEMP}/sdist-venv/bin/python"
          "${VPY}" -m pip install --upgrade pip
          # [dev] is the single source of truth for test tooling, streamlit and
          # plotly included. No trailing package suffix here, in ci.yml, or in
          # test-wheel: a suffix would let the workflows drift from the declared
          # metadata, which is how those two packages went undeclared for as
          # long as they did.
          "${VPY}" -m pip install "${SDIST}[dev]"

          # Run from a directory containing ONLY what the sdist shipped, and NOT
          # ./nmtcapp. Running from ${SRC} itself would put the unpacked source
          # tree on sys.path and silently test that instead. tests/ and
          # streamlit_app/ come FROM THE TARBALL — this job has no checkout to
          # take them from, which is the whole point.
          #
          # templates/ is deliberately NOT copied. Since 1.2.0 it lives inside
          # the package as nmtcapp/templates/ and the tests resolve it through
          # the INSTALLED package (tests/conftest.py::templates_dir). Copying it
          # here would mean creating ${TESTDIR}/nmtcapp/, and a bare nmtcapp/
          # directory in the working directory shadows the installed package as
          # a namespace package — turning this job into a test of the tarball's
          # own source tree, the exact failure the paragraph above guards.
          TESTDIR="${RUNNER_TEMP}/sdist-tests"
          mkdir -p "${TESTDIR}"
          cp -R "${SRC}/tests" "${TESTDIR}/tests"
          cp -R "${SRC}/streamlit_app" "${TESTDIR}/streamlit_app"
          cp "${SRC}/README.md" "${TESTDIR}/README.md"
          # pyproject.toml comes from the tarball too, because it carries
          # [tool.pytest.ini_options] where the `wheel` marker is registered.
          # That marker is what `-m "not wheel"` deselects on, so without the ini
          # file the run emits PytestUnknownMarkWarning, deselects nothing, and
          # --strict-markers turns it into a collection error.
          cp "${SRC}/pyproject.toml" "${TESTDIR}/pyproject.toml"
          cd "${TESTDIR}"

          ORIGIN="$("${VPY}" -c 'import nmtcapp; print(nmtcapp.__file__)')"
          echo "import resolved to    : ${ORIGIN}"
          case "${ORIGIN}" in
            *"/site-packages/"*) ;;
            *) echo "::error::import nmtcapp resolved to '${ORIGIN}', not the installed sdist"; exit 1 ;;
          esac

          INSTALLED="$("${VPY}" -c 'import nmtcapp; print(nmtcapp.__version__)')"
          EXPECTED="${GITHUB_REF_NAME#v}"
          echo "installed __version__ : ${INSTALLED}"
          echo "expected (from tag)   : ${EXPECTED}"
          if [ "${INSTALLED}" != "${EXPECTED}" ]; then
            echo "::error::Installed sdist reports '${INSTALLED}', expected '${EXPECTED}'"
            exit 1
          fi

          # -m "not wheel" matches ci.yml and test-wheel: test_wheel_completeness
          # shells out to build a wheel from the project root, which is a repo
          # operation, not something the tarball's own suite should attempt.
          # --strict-markers so a missing ini file fails loudly instead of
          # silently deselecting nothing.
          # --junitxml so the NEXT step can count what actually executed. The
          # module-count check alone cannot: see the note there.
          "${VPY}" -m pytest tests -m "not wheel" --tb=short --no-header \
            --import-mode=importlib --strict-markers \
            --junitxml="${RUNNER_TEMP}/sdist-junit.xml"

      - name: Assert the sdist suite is not silently truncated
        shell: bash
        run: |
          set -euo pipefail
          SDIST="$(ls dist/*.tar.gz)"
          # grep exits 1 on no-match and 2 on error: tolerate 1 so SHIPPED is "0"
          # and the emptiness check below produces the real message; let 2 abort.
          # Was `|| true`, which swallowed 2 as well: SHIPPED became empty, the
          # `-eq 0` test then errored instead of returning true, its branch was
          # skipped, and the step exited 0 -- the gate PASSED on a broken grep.
          SHIPPED="$(tar tzf "${SDIST}" | grep -cE '/tests/(.*/)?test_[^/]*\.py$' || test $? -eq 1)"
          echo "test modules in sdist: ${SHIPPED}"
          # This job deliberately has NO checkout, so it cannot compare the
          # tarball against the repository — that comparison lives in `build`,
          # which holds both. What this job CAN assert with nothing but the
          # tarball is that MANIFEST.in did not match nothing at all, which is
          # the failure that would otherwise let the suite "pass" by running
          # zero tests. Deliberately not an absolute threshold.
          if [ "${SHIPPED}" -eq 0 ]; then
            echo "::error::sdist ships no test modules at all — MANIFEST.in matches nothing"
            exit 1
          fi

          # The check above counts MODULES SHIPPED. It never counts EXECUTIONS,
          # and those are different numbers: a suite where every test skips or
          # is deselected exits 0 while shipping every module it should.
          #   2 skipped in 0.00s     -> pytest exit code 0
          #   1 deselected in 0.00s  -> pytest exit code 0
          # This repo passes `-m "not wheel"`, so it is directly exposed: widen
          # that expression, or re-mark the suite `wheel`, and every test is
          # deselected while the module count stays untouched and every gate
          # stays green. That is the same vacuity class as an empty parametrize,
          # at job scale -- and this repo already carries a live instance of the
          # small-scale version, see empty_parameter_set_mark in pyproject.toml.
          #
          # FLOOR DERIVATION -- not a number picked to be safe. The rule is
          # HALF of what the suite genuinely runs today, rounded down to a
          # round number.
          #
          # RE-MEASURED for 1.2.0, and corrected. An earlier version of this
          # comment said "894 tests executed", which is the COLLECTED count, not
          # the executed one -- and this step's own formula is total MINUS
          # SKIPPED. In the sdist four tests skip
          # (test_no_committed_generated_artifacts.py, which needs a git
          # checkout and explicitly says so), so:
          #
          #     collected under -m "not wheel"   896
          #     skipped in the sdist              -4
          #     EXECUTED                         892   <- what the formula returns
          #     half                             446
          #     rounded down                     440
          #
          # 440 was already correct; the derivation printed beside it was not.
          # Getting that backwards is exactly the class of error this file's
          # gates exist to catch, so it is corrected rather than left.
          #
          # RE-MEASURED FOR 1.2.1, AND THE NUMBER MOVES. The 1.2.0 derivation
          # above is now false in both of its inputs, in a file whose entire
          # premise is that its numbers are evidence. Measured by building the
          # sdist from a pristine clone and running THIS JOB'S EXACT INVOCATION
          # from inside the unpacked tarball:
          #
          #     collected under -m "not wheel"   954
          #     skipped in the sdist            -11
          #     EXECUTED                         943   <- what the formula returns
          #     half                             471.5
          #     rounded down                     470
          #
          # THE SKIP COUNT TRIPLED, AND EVERY ONE IS DELIBERATE. Each is a test
          # whose question is not the sdist's to answer, skipped explicitly
          # with its own written reason rather than tolerated by a try/except:
          #
          #     4  test_no_committed_generated_artifacts.py  needs a git
          #        checkout; MANIFEST.in prunes examples/. Unchanged in 1.2.1.
          #     4  test_pinned_constants.py  the two constant SWEEPS and the
          #        name-resolution check read the package SOURCE to enumerate
          #        its constants, and this job deliberately runs with no
          #        nmtcapp/ in the working directory. Every PIN still executes
          #        here — only the derivation of the list is skipped.
          #     3  test_121_financial_tables.py  the docs-hook gate (docs/ is
          #        pruned), the docs-withdrawal scan (same), and the
          #        attribution sweep that reads integrations/ source.
          #
          # Two of those eleven were FAILURES before 1.2.1, not skips, and this
          # job exited 1 on them. CI stayed green because CI runs from a
          # checkout; a tag on that artifact would have failed here with
          # nothing on PyPI. See the S-1 note in CHANGELOG.md.
          #
          # The jump from 350 is not drift. 1.2.0 adds:
          #   151  test_no_fabricated_output.py -- 18 denylist entries x 4
          #        rendered formats x 2 pipelines (144), plus the size and
          #        well-formedness guards, the placeholder-presence checks and
          #        the source-citation check. (An earlier version of this
          #        comment said "17 entries" and gave 150; the list has 18 and
          #        the file runs 151. The count is now pinned in the test as
          #        EXPECTED_DENYLIST_SIZE rather than described here.)
          #     5  test_invariant_output.py -- the invariance gate. Few tests,
          #        but it renders 4 disjoint scenarios x 4 formats and is the
          #        gate that catches a fabrication nobody listed in advance.
          #     5  test_attributed_claims.py -- the attribution gate. Catches
          #        the class the invariance gate cannot: a claim that VARIES
          #        with input and is still unsupportable.
          #     4  test_no_committed_generated_artifacts.py
          #    14  test_mapper_contract.py
          #     4  test_cde_scaffold_roundtrip.py
          # and removes the two HMDA adapter tests with the adapter itself.
          # Recount before changing this line again; a floor copied forward
          # from a previous release stops being evidence.
          #
          # KNOWN SLACK, stated rather than implied: 500 leaves 507 tests of
          # headroom. It catches the regression this repo is prone to (the 36
          # nested modules failing to ship drops the run to 238), and total
          # deselection lands at 0. It would NOT catch losing tests/sections/
          # + tests/tables/ + tests/validation/ together.
          #
          # Half, deliberately: the rejected `-lt 14` threshold sat at the
          # exact count shipping that day, so deleting one test module failed
          # the job with a packaging error for a deliberate source change.
          # This one has 537 tests of headroom -- you would have to delete more
          # than half the suite before it complains, while total deselection
          # lands at 0 and trips it immediately. It would also catch the
          # narrower regression this repo is actually prone to: the 36 nested
          # modules failing to ship takes the run far below 520.
          #
          # THE SKIP COUNT IS PART OF THIS NUMBER, and that is a real coupling
          # rather than an accident of arithmetic: the formula is total MINUS
          # skipped, so adding a deliberate skip lowers EXECUTED and re-deriving
          # the floor from it lowers the floor. Eleven skips against 1,068
          # collected is 1.0%; if that ever climbs, the right response is to ask
          # why the sdist stopped being able to answer its own suite's
          # questions, not to keep re-deriving downward.
          #
          # RE-MEASURED FOR 1.3.0 B1, AND STALE AGAIN - the FIFTH hand-typed
          # count in this cycle to go stale (FLOOR=125, FLOOR=440, 133 in three
          # places, FLOOR=470, FLOOR=500).
          #
          # RE-MEASURED FOR 1.3.1, AND THE GATE IS WHAT ANNOUNCED IT. 1.3.1
          # added 47 tests; test_release_floor_is_derived_from_the_current_suite
          # went red on FLOOR=530 before anything here was touched, which is
          # the first time in this file's history that a stale floor was caught
          # by a check rather than by a person re-reading the comment.
          #
          # Re-derived from a PRISTINE CLONE at bd5de80 with this job's exact
          # invocation -- built the sdist, unpacked it, installed the tarball
          # with [dev] into a fresh venv, copied ONLY tests/, streamlit_app/,
          # README.md and pyproject.toml out of the tarball into a directory
          # with no nmtcapp/ in it, and ran from there:
          #
          #     collected under -m "not wheel" 1,143
          #     skipped in the sdist             -23
          #     EXECUTED                       1,120   <- what the formula returns
          #     half                             560
          #     rounded down                     560
          #
          # Identical on 3.9.25 and 3.12.13: both 1,120 passed / 23 skipped /
          # 1 deselected. ("3.9.12" stood here and was a typo; no 3.9.12 was
          # ever run.)
          #
          # RE-DERIVED AGAIN IN 1.3.1's FIX ROUND, AND IT DID NOT MOVE. That
          # round added six tests, so the same invocation now measures:
          #
          #     collected under -m "not wheel" 1,150
          #     skipped in the sdist             -25
          #     EXECUTED                       1,125
          #     half                             562
          #     rounded down                     560   <- unchanged
          #
          # Identical on 3.9.25 and 3.12.13: both 1,125 passed / 25 skipped /
          # 1 deselected. The two new skips are that round's own and are the
          # same environment class as the rest: one sweep reads nmtcapp/, and
          # one claim site is CONTRIBUTING.md, which the tarball ships and this
          # job does not copy out.
          #
          # THE THREE NEW SKIPS ARE ALL THE SAME OLD CLASS, and each names its
          # own reason: test_the_changelogs_baseline_class_table_adds_up needs
          # a git checkout (1.3.1 G7), and test_truncated_lists' sweep and its
          # ruled-exception check read the package SOURCE, which this job
          # deliberately does not put beside tests/ (1.3.1 F1).
          #
          # RE-MEASURED FOR FIX-2, AND THE 1.3.0 MEASUREMENT WAS TAKEN
          # THE WRONG WAY. This comment recorded
          #
          #     collected under -m "not wheel" 1,068
          #     skipped in the sdist             -11
          #     EXECUTED                       1,057
          #
          # and 11 is not what this job produces. It is what the suite produces
          # when it is run from INSIDE the unpacked tarball - which the
          # paragraph above forbids, because running there puts the tarball's
          # own source tree on sys.path and un-skips every check that asks "is
          # nmtcapp/ next to tests/". Run as this job actually runs it, from
          # ${TESTDIR} with nothing but the tarball's tests/ and
          # streamlit_app/, the sdist skips TWENTY.
          #
          # FLOOR=520 happened to be correct either way; the derivation printed
          # beside it measured a different run. That is the same error 1.2.0
          # made in the opposite direction (COLLECTED where the formula wants
          # EXECUTED), and it is worse than a stale digit: a digit that is
          # stale gets remeasured, and a derivation that is plausible gets
          # copied.
          #
          # FIX-2, measured from a pristine clone with this job's exact
          # invocation, on 3.9 and 3.12:
          #
          #     collected under -m "not wheel" 1,096
          #     skipped in the sdist             -20
