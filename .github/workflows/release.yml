name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-version:
    name: Guard — tag must match pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Check tag equals pyproject.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Git tag    : $TAG"
          echo "Tag version: $TAG_VERSION"
          echo "pyproject  : $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "ERROR: git tag '$TAG' does not match pyproject.toml version '$PYPROJECT_VERSION'."
            exit 1
          fi
          echo "Version guard passed: $TAG_VERSION == $PYPROJECT_VERSION"

  build:
    name: Build wheel + sdist
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Install build toolchain
        run: pip install build
      - name: Build
        run: python -m build
      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  test-wheel:
    name: Test wheel — Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Install built wheel into a fresh venv
        run: |
          python -m venv /tmp/wheel_test_venv
          /tmp/wheel_test_venv/bin/pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          /tmp/wheel_test_venv/bin/pip install "${WHEEL}[dev]" streamlit plotly
      - name: Confirm installed version matches the tag
        run: |
          INSTALLED=$(/tmp/wheel_test_venv/bin/python -c "import nmtcapp; print(nmtcapp.__version__)")
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Installed: $INSTALLED   Expected: $TAG"
          if [ "$INSTALLED" != "$TAG" ]; then
            echo "ERROR: installed __version__ does not match the git tag."
            exit 1
          fi
      - name: Run suite against installed wheel
        run: |
          /tmp/wheel_test_venv/bin/pytest tests/ -m "not wheel" -v --tb=short --no-header --import-mode=importlib

  publish:
    name: Publish to PyPI
    needs: [verify-version, build, test-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nmtc-application-builder/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing — no API token)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
