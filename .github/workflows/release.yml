          # is not added here because it would be RED ON ARRIVAL -- 57 against
          # 57 leaves no room -- and landing a red gate is not this round's job.
          # 1.5.7 -- RE-DERIVED THE LONG WAY AN EIGHTH TIME, AND FLOOR MOVES
          # 780 -> 790. test_release_floor_is_derived_from_the_current_suite
          # went red on FLOOR=780 before this file was opened, for the EIGHTH
          # consecutive cycle: 780 sat exactly on its band's lower bound (the
          # 1.5.6 close said so), so 1.5.7's 23 new cases -- 15 in
          # test_streamlit_page_drive.py and 8 in test_shipped_workbook_xml.py
          # -- pushed the bound past it. THE GATE ANNOUNCED IT; this number
          # was not noticed by hand.
          #
          # Derived from a REAL SDIST BUILD with this job's exact invocation,
          # on 3.12.13: pristine clone with no egg-info, `python -m build
          # --sdist`, the tarball installed with [dev] into a fresh venv, ONLY
          # tests/, streamlit_app/, README.md and pyproject.toml copied out of
          # it into a directory with NO nmtcapp/, `import nmtcapp` confirmed to
          # resolve to site-packages, and the figures read off the junit report
          # rather than off the terminal:
          #
          #     junit total (not wheel)        1,640
          #     skipped in the sdist             -57
          #     EXECUTED                       1,583
          #     half                             791
          #     rounded down to ten              790
          #
          # The tarball ran CLEAN on that build: 1,583 passed, 57 skipped, 1
          # deselected, zero failures.
          #
          # NEITHER GATE 1.5.7 ADDS SKIPS ANYWHERE, AND THAT IS MEASURED FROM
          # THE SAME JUNIT REPORT, NOT ASSERTED: the per-module skip breakdown
          # names 17 modules and neither test_streamlit_page_drive nor
          # test_shipped_workbook_xml is among them. The page-driving gate was
          # designed for this -- it stubs st.file_uploader's RETURN VALUE
          # instead of using AppTest's FileUploader accessor, which does not
          # exist in the streamlit 1.50.0 that `[dev]` resolves on PYTHON 3.9,
          # so it needs no skipif on a quarter of the CI matrix.
          #
          # SUPERSEDED, KEPT FOR THE TRAIL -- 1.5.6's derivation: test_release_floor_is_derived_from_the_current_suite
          # went red on FLOOR=770 before this file was opened, for the seventh
          # consecutive cycle: 770 sat exactly on its band's lower bound (the
          # 1.5.5 close said so in as many words), so 1.5.6's NINE new cases
          # -- two parametrised gates, four cases each, plus one structural
          # AST gate -- pushed the bound past it. THE GATE ANNOUNCED IT; this
          # number was not noticed by hand.
          #
          # Derived from a REAL SDIST BUILD with this job's exact invocation,
          # on 3.12.13: pristine clone with no egg-info, `python -m build
          # --sdist`, the tarball installed with [dev] into a fresh venv, ONLY
          # tests/, streamlit_app/, README.md and pyproject.toml copied out of
          # it into a directory with NO nmtcapp/, `import nmtcapp` confirmed to
          # resolve to site-packages, and the breakdown read off the junit
          # report rather than off the terminal:
          #
          #     collected under -m "not wheel" 1,617
          #     skipped in the sdist             -57
          #     EXECUTED                       1,560
          #     half                             780.0
          #     rounded down                     780
          #
          # The tarball ran CLEAN on that build: 1,560 passed, 57 skipped, 1
          # deselected, zero failures. The resulting band is [780, 808].
          #
          # MAX_SDIST_SKIPS DOES NOT MOVE, AND THAT IS THE MEASUREMENT TOO:
          # the same run skipped exactly 57, the value the constant already
          # carries and the same 57 the 1.5.4 and 1.5.5 derivations measured.
          # 1.5.6 ADDS NO SKIPPING CASE, and it was designed not to -- all
          # five backends the new canvas sweep parametrises over (agg, svg,
          # pdf, ps, template) ship INSIDE matplotlib and need no optional
          # dependency, so none of the nine new cases can skip. A backend
          # needing pycairo or Tornado would have been the easy choice and was
          # rejected for exactly this reason.
          #
          # HEADROOM IS STILL ZERO, AND STILL NOT BOUGHT. Measured skips (57)
          # EQUAL the ceiling (57), as they did at 1.5.4 and 1.5.5. The next
          # round that adds a single skipping case breaches it. NOT RAISED
          # HERE: raising it is the move this bound exists to make somebody
          # defend, and this round is a one-defect hotfix.
          #
          # AND STILL OPEN, RECORDED A FOURTH TIME: NOTHING MACHINE-ENFORCES
          # THE MEASURED SKIP COUNT AGAINST THIS CONSTANT. test_small_claims
          # bounds the CONSTANT; nothing compares the MEASUREMENT above to it.
          # Still not added here, and for the same reason as at 1.5.5 -- 57
          # against 57 leaves no room, so the gate would be RED ON ARRIVAL.
          FLOOR=790
          EXECUTED="$(python - "${RUNNER_TEMP}/sdist-junit.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          # Deselected tests never appear in the report at all, so they are
          # absent from `total` -- which is exactly what makes this catch them.
          print(total - skipped)
          PY
          )"
          echo "tests actually executed: ${EXECUTED}  (floor ${FLOOR})"

          # THE SKIP BREAKDOWN, DERIVED (1.5.4 audit close, B5). The paragraph
          # above used to be the only record of which modules skip and how
          # often, and it went stale the way every hand-typed count in this
          # file has. Printed from the junit report the run just produced, so
          # re-deriving it is reading a log line rather than counting by hand.
          echo "--- skips by module, from this run ---"
          python - "${RUNNER_TEMP}/sdist-junit.xml" <<'PY'
          import collections, sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          def module_of(classname):
              # The last dotted component that names a test module. Not
              # split(".")[1]: that yields "validation" for a nested
              # tests.validation.test_x, and 36 of this suite's modules are
              # nested.
              parts = [p for p in classname.split(".") if p.startswith("test_")]
              return parts[-1] if parts else classname or "<unknown>"

          counts = collections.Counter(
              module_of(case.get("classname", ""))
              for case in root.iter("testcase")
              if case.find("skipped") is not None
          )
          for module, count in sorted(counts.items(), key=lambda kv: (-kv[1], kv[0])):
              print(f"{count:5d}  {module}")
          print(f"{sum(counts.values()):5d}  TOTAL")
          PY
          if [ "${EXECUTED}" -lt "${FLOOR}" ]; then
            echo "::error::the sdist suite executed only ${EXECUTED} tests, below the floor of ${FLOOR}."
            echo "::error::Shipping every test module is not the same as running them. Check for a"
            echo "::error::marker change or an -m expression that deselected the suite. If the suite"
            echo "::error::genuinely shrank by more than half, re-derive FLOOR from the new count."
            exit 1
          fi

  publish:
    name: Publish to PyPI
    needs: [verify-version, build, test-wheel, test-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nmtc-application-builder/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing — no API token)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
