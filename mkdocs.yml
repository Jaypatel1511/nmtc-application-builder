site_name: NMTC Application Builder
site_description: >-
  Open-source intelligence platform for CDEs preparing New Markets Tax Credit
  allocation applications to the CDFI Fund.
site_url: https://jaypatel1511.github.io/nmtc-application-builder/
repo_url: https://github.com/Jaypatel1511/nmtc-application-builder
repo_name: Jaypatel1511/nmtc-application-builder
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Jaypatel1511/nmtc-application-builder
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/nmtc-application-builder/

copyright: Copyright &copy; 2025 Jay Patel. MIT License.

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quickstart: quickstart.md
  - User Guide:
    - Pipeline Analysis: workflow/pipeline-analysis.md
    - Win Alignment Scoring: workflow/win-alignment.md
    - Recommendations: workflow/recommendations.md
    - Pipeline Optimization: workflow/optimization.md
    - Generating Outputs: workflow/output-formats.md
    - Visualizations: workflow/visualizations.md
  - Reference:
    - API Reference: reference/api.md
    - Data Sources: reference/data-sources.md
    - Methodology: reference/methodology.md
  - About:
    - Why NMTC Builder: about/why.md
    - Limitations: about/limitations.md
    - Contributing: about/contributing.md
